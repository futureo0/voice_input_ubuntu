# voice_input: 按需回声消除 context (on-demand AEC)
#
# 这个文件不是放进 ~/.config/pipewire/pipewire.conf.d/ 常驻的。
# voice_input 录音时用 `pipewire -c <本文件>` 临时拉起一个独立 PipeWire
# context,加载回声消除模块生成 echo-cancel-source;录音结束后进程被终止,
# 模块随之卸载、真实麦克风立即释放。这样空闲时不占用麦克风,GNOME 顶栏的
# 麦克风图标只在真正录音的那几秒亮起。
#
# 前 4 个模块是独立 context 连接到主 PipeWire 会话所需的基础模块
# (取自系统默认 filter-chain.conf),最后才是回声消除模块本身。

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    # 回声消除:monitor.mode = true 表示不创建虚拟 sink、不改默认输出设备,
    # 而是监听当前默认 sink 正在播放的内容作为参考信号,从默认麦克风采集并
    # 消除电脑自身发出的声音,干净的音频从 echo-cancel-source 输出。
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name  = aec/libspa-aec-webrtc
            monitor.mode  = true
            capture.props = {
                node.name    = "echo-cancel-capture"
                node.passive = true
            }
            source.props = {
                node.name        = "echo-cancel-source"
                node.description = "Echo Cancelled Mic (voice_input)"
                # 不抢默认麦克风:默认源保持真实麦克风,只有本工具显式录这个源。
                priority.session = 100
                priority.driver  = 100
            }
            aec.args = {
                webrtc.gain_control       = false
                webrtc.extended_filter    = true
                webrtc.high_pass_filter   = true
                webrtc.noise_suppression  = true
            }
        }
    }
]
